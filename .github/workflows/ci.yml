name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-tests:
    name: Page script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # ubuntu and macOS test on their respective hosts on both GitHub and the
  # Gitea backup mirror; the two windows jobs below split by host because the
  # hosts only share the ubuntu/macos labels.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      # Same packages as scripts/setup-dev.sh installs on apt-based distros.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check formatting
        if: matrix.os == 'macos-latest'
        run: cargo fmt --check
      # Each OS compiles its own platform-specific code (notifications,
      # permissions, tray), so this is also the cross-platform build check.
      - name: Test
        run: cargo test
      # Advisory: lints are reported in the log but do not fail the build.
      - name: Clippy
        run: cargo clippy --all-targets

  # GitHub hosts a real Windows runner, so the Windows code finally gets
  # executed, not just cross-compiled.
  windows:
    name: Rust (windows)
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        run: cargo test
      # Advisory: lints are reported in the log but do not fail the build.
      - name: Clippy
        run: cargo clippy --all-targets

  # The Gitea backup mirror keeps its cargo-xwin cross-compile flavor: that
  # runner is a Linux container with the MSVC cross toolchain, so test
  # binaries cannot run — build and lint only. See release.yml's header for
  # the full story on the per-host split.
  windows-cross:
    name: Rust (windows cross)
    if: github.server_url != 'https://github.com'
    runs-on: windows-cross-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build (Windows cross)
        run: cargo xwin build --target x86_64-pc-windows-msvc
      - name: Clippy (Windows cross, advisory)
        run: cargo xwin clippy --target x86_64-pc-windows-msvc
