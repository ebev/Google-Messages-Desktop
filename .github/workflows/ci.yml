name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-tests:
    name: Page script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-cross-latest is a Linux container (no WebKitGTK) that
        # cross-compiles for MSVC via cargo-xwin; it is not a Windows host, so
        # runner.os is Linux there and steps must key on matrix.os instead.
        os: [macos-latest, windows-cross-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # Same packages as scripts/setup-dev.sh installs on apt-based distros.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check formatting
        if: matrix.os == 'macos-latest'
        run: cargo fmt --check
      # Each OS compiles its own platform-specific code (notifications,
      # permissions, tray), so this is also the cross-platform build check.
      - name: Test
        if: matrix.os != 'windows-cross-latest'
        run: cargo test
      # Advisory: lints are reported in the log but do not fail the build.
      - name: Clippy
        if: matrix.os != 'windows-cross-latest'
        run: cargo clippy --all-targets
      # MSVC-target test binaries cannot run without Windows, so the cross leg
      # only builds and lints.
      - name: Build (Windows cross)
        if: matrix.os == 'windows-cross-latest'
        run: cargo xwin build --target x86_64-pc-windows-msvc
      - name: Clippy (Windows cross, advisory)
        if: matrix.os == 'windows-cross-latest'
        run: cargo xwin clippy --target x86_64-pc-windows-msvc
