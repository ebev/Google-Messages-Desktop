name: release-packages

# Version tag -> per-OS packages uploaded straight to the GitHub release.
#
# GitHub primary: the repo's primary CI lives on GitHub; Gitea receives this
# repo as a backup mirror and has no native Windows runner, so every job is
# gated on github.server_url and a Gitea push skips all jobs cleanly instead
# of queueing on a label its fleet can't serve. To restore Gitea packaging,
# restore the cross-compile flavor (runs-on windows-cross-latest,
# --runner cargo-xwin, the Gitea asset API) from this file's git history
# and drop the gates.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Packages (${{ matrix.os }}${{ matrix.tarch && format(' {0}', matrix.tarch) || '' }})
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: deb,rpm
          - os: windows-latest
            targets: nsis
            tarch: x86_64-pc-windows-msvc
          - os: windows-latest
            targets: nsis
            tarch: aarch64-pc-windows-msvc
          - os: macos-latest
            targets: dmg
    steps:
      - uses: actions/checkout@v4
      # The tag must name the version being built: v1.4.0 and v1.4.0-TEST1
      # both match a 1.4.0 tree, v1.5.0 does not.
      - name: Check tag matches Cargo.toml version
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          tag="${REF#refs/tags/}"
          tag_version="${tag#v}"
          tag_version="${tag_version%%-*}"
          if [ -z "$crate_version" ] || [ "$tag_version" != "$crate_version" ]; then
            echo "Version mismatch: ref=$REF tag=$tag tag version=$tag_version Cargo.toml version=$crate_version"
            exit 1
          fi
          echo "Tag $tag matches Cargo.toml version $crate_version"
      - run: npm ci
      # Same packages as scripts/setup-dev.sh installs on apt-based distros.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # All legs run this: on mac it puts cargo on the PATH; on Windows the
      # matrix target is the MSVC arch the packaging leg builds for.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tarch }}
      - name: Build (Linux deb/rpm)
        if: matrix.os == 'ubuntu-latest'
        run: npm run tauri build -- -b deb,rpm
      # Native Windows runners; the arm64 leg cross-compiles the ARM64 target
      # on the x64 host, and the NSIS stub installs it under WoA emulation.
      - name: Build (Windows nsis)
        if: matrix.os == 'windows-latest'
        run: npm run tauri build -- -b nsis --target ${{ matrix.tarch }}
      # Ad-hoc signed (signingIdentity "-" in tauri.conf.json), not notarized.
      - name: Build (macOS dmg)
        if: matrix.os == 'macos-latest'
        run: npm run tauri build -- -b dmg

      # Every leg uploads to the same release. The first leg to arrive creates
      # it (GET by tag, POST on 404); a leg that loses that race gets 422 and
      # re-reads the release the other leg created.
      - name: Verify and upload to release
        shell: bash
        env:
          OS: ${{ matrix.os }}
          TARCH: ${{ matrix.tarch }}
          REF: ${{ github.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: https://api.github.com/repos/${{ github.repository }}
          UPLOAD: https://uploads.github.com/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${REF#refs/tags/}"
          bundle=src-tauri/target/release/bundle
          archbundle="src-tauri/target/$TARCH/release"
          if [ -z "$TARCH" ]; then archbundle="src-tauri/target/release"; fi

          artifacts=()
          need() {
            # need <description> <dir> <find -name pattern>
            local found
            found=$(find "$2" -maxdepth 1 -type f -name "$3" 2>/dev/null || true)
            if [ -z "$found" ]; then
              echo "Missing artifact for $OS: $1 (expected $2/$3)"
              exit 1
            fi
            while IFS= read -r f; do artifacts+=("$f"); done <<< "$found"
          }
          case "$OS" in
            ubuntu-latest)
              need deb "$bundle/deb" '*.deb'
              need rpm "$bundle/rpm" '*.rpm'
              ;;
            windows-latest)
              # Installers only — no portable exes: rustc names them the same
              # for both arches, which collides on the release. Ship one NSIS
              # installer per arch instead.
              need "nsis installer" "$archbundle/bundle/nsis" '*-setup.exe'
              ;;
            macos-latest)
              need dmg "$bundle/dmg" '*.dmg'
              ;;
            *)
              echo "Unknown matrix.os: $OS"
              exit 1
              ;;
          esac
          printf 'Found: %s\n' "${artifacts[@]}"

          auth="Authorization: Bearer $TOKEN"
          resp=$(mktemp)

          get_release() {
            curl -sS -o "$resp" -w '%{http_code}' -H "$auth" "$API/releases/tags/$tag"
          }
          code=$(get_release)
          if [ "$code" = "404" ]; then
            echo "No release for $tag yet, creating it"
            code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
              -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"body\":\"\"}" \
              "$API/releases")
            # GitHub answers 422 (not 409) when the tag already has a release.
            if [ "$code" = "422" ] || [ "$code" = "409" ]; then
              echo "Release for $tag was created concurrently, re-reading it"
              code=$(get_release)
            fi
          fi
          case "$code" in
            200|201) ;;
            *)
              echo "Release lookup/creation failed for $tag (HTTP $code):"
              cat "$resp"
              exit 1
              ;;
          esac
          # The release id — GitHub pretty-prints ("id": 123), so parse JSON
          # rather than grepping compact Gitea-style output.
          id=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$resp")
          if [ -z "$id" ]; then
            echo "Could not read release id from response:"
            cat "$resp"
            exit 1
          fi
          echo "Using release $id for $tag"

          for f in "${artifacts[@]}"; do
            name=$(basename "$f")
            # Re-upload safety: delete any existing asset with the same name,
            # so a re-run replaces packages instead of failing on a duplicate.
            del_ids=$(curl -sS -H "$auth" "$API/releases/$id/assets" | python3 -c "import json,sys; asset_name=sys.argv[1]; print('\n'.join(str(a['id']) for a in json.load(sys.stdin) if a.get('name')==asset_name))" "$name")
            for aid in $del_ids; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$auth" "$API/releases/assets/$aid")
              echo "Deleted stale asset id $aid (HTTP $code)"
            done
            # Bundle names contain a space ("Google Messages_..."); encode it
            # for the query string. GitHub wants a raw binary upload, not the
            # multipart form Gitea's asset API took.
            code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST -H "$auth" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@$f" \
              "$UPLOAD/releases/$id/assets?name=${name// /%20}")
            if [ "$code" != "201" ]; then
              echo "Upload of $name failed (HTTP $code):"
              cat "$resp"
              exit 1
            fi
            echo "Uploaded asset: $name"
          done

          # Read the release back and verify every expected asset name exists.
          code=$(curl -sS -o "$resp" -w '%{http_code}' -H "$auth" "$API/releases/$id/assets?per_page=100")
          if [ "$code" != "200" ]; then
            echo "Asset listing failed (HTTP $code):"
            cat "$resp"; exit 1
          fi
          python3 -c "import json,sys; a=json.load(open(sys.argv[1])); e=sorted(f.rsplit('/',1)[-1] for f in sys.argv[3:]); h=sorted(x['name'] for x in a); m=[n for n in e if n not in h]; print(('FAILED' if m else 'PASSED'), sys.argv[2], 'expected', e, 'missing', m); sys.exit(1 if m else 0)" "$resp" "$OS" "${artifacts[@]}"
