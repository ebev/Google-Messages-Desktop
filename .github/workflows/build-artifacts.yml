name: build-artifacts

# Every push to the build branches produces downloadable artifacts on this
# workflow's run page: per-arch Windows NSIS installers, deb/rpm, and the
# macOS dmg. Superseded runs cancel themselves, so the latest push always
# wins without stampeding the runners.

on:
  push:
    branches: [main, v1.5]
  workflow_dispatch:

concurrency:
  group: artifacts-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: deb,rpm
          - os: windows-cross-latest
            targets: nsis
            tarch: x86_64-pc-windows-msvc
          - os: windows-cross-latest
            targets: nsis
            tarch: aarch64-pc-windows-msvc
          - os: macos-latest
            targets: dmg
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Same packages as scripts/setup-dev.sh installs on apt-based distros.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          workspaces: src-tauri
      # All legs run this: on mac it verifies rustup fast AND puts cargo on the
      # launchd PATH (which lacks ~/.cargo/bin — without it tauri can't run
      # `cargo metadata` and the leg dies in a second).
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (Linux deb/rpm)
        if: matrix.os == 'ubuntu-latest'
        run: npm run tauri build -- -b deb,rpm
      # windows-cross-latest is a Linux container: cargo-xwin links against the
      # MSVC SDK and makensis builds the installer, so no Windows host is needed.
      - name: Build (Windows cross, nsis)
        if: matrix.os == 'windows-cross-latest'
        run: npm run tauri build -- -b nsis --runner cargo-xwin --target ${{ matrix.tarch }}
      # Ad-hoc signed (signingIdentity "-" in tauri.conf.json), not notarized.
      - name: Build (macOS dmg)
        if: matrix.os == 'macos-latest'
        run: npm run tauri build -- -b dmg
      - name: Post artifacts to the snapshots release
        shell: bash
        env:
          OS: ${{ matrix.os }}
          TARCH: ${{ matrix.tarch }}
          REF: ${{ gitea.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: https://gitea.eabev.com/api/v1/repos/eric/Google-Messages
        run: |
          set -euo pipefail
          snaptag="v$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)-snapshots"
          case "$OS" in
            ubuntu-latest)
              base="src-tauri/target/release/bundle"
              set -- "$base/deb/"*.deb "$base/rpm/"*.rpm
              ;;
            windows-cross-latest)
              set -- "src-tauri/target/${{ matrix.tarch }}/release/bundle/nsis/"*-setup.exe
              ;;
            macos-latest)
              set -- "src-tauri/target/release/bundle/dmg/"*.dmg
              ;;
            *) echo "Unknown matrix.os: $OS"; exit 1 ;;
          esac
          [ -e "$1" ] || { echo "No artifacts built for $OS"; exit 1; }
          auth="Authorization: token $TOKEN"
          resp=$(mktemp)
          code=$(curl -sS -o "$resp" -w '%{http_code}' -H "$auth" "$API/releases/tags/$snaptag")
          if [ "$code" = "404" ]; then
            code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
              -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$snaptag\",\"name\":\"$snaptag\",\"body\":\"rolling build of $REF\",\"prerelease\":true}" \
              "$API/releases")
            if [ "$code" = "409" ]; then
              echo "Release created concurrently, re-reading it"
              code=$(curl -sS -o "$resp" -w '%{http_code}' -H "$auth" "$API/releases/tags/$snaptag")
            fi
          fi
          case "$code" in
            200|201) ;;
            *)
              echo "Release lookup/creation failed for $snaptag (HTTP $code):"
              cat "$resp"; exit 1
              ;;
          esac
          id=$(grep -o '"id":[0-9]*' "$resp" | head -n 1 | cut -d: -f2)
          echo "Using snapshots release $id for $snaptag"
          for f in "$@"; do
            name=$(basename "$f")
            assets_json="$(curl -sS -H "$auth" "$API/releases/$id/assets")"
            del_ids=$(printf '%s' "$assets_json" | python3 -c "import json,sys; asset_name=sys.argv[1]; [print(a['id']) for a in json.load(sys.stdin) if a.get('name')==asset_name]" "$name")
            for aid in $del_ids; do
              dcode=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$auth" "$API/releases/$id/assets/$aid")
              echo "Deleted stale asset id $aid (HTTP $dcode)"
            done
            ucode=$(curl -sS -o "$resp" -w '%{http_code}' -X POST -H "$auth" \
              --form "attachment=@$f" \
              "$API/releases/$id/assets?name=${name// /%20}")
            if [ "$ucode" != "201" ]; then
              echo "Upload of $name failed (HTTP $ucode):"
              cat "$resp"; exit 1
            fi
            echo "Uploaded asset: $name"
          done
