<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recent messages</title>
    <style>
      /* Two looks, chosen at startup from the OS (see LOOK): "mac" is a menu
         bar panel over the system popover material (the window is see-through
         there), "win" is a Windows 11 tray flyout. Each sets the variables the
         shared rules below use, in light and dark (`data-scheme`, set by
         applyScheme()). */
      :root.mac {
        color-scheme: light;
        --fg: rgba(0, 0, 0, 0.85);
        --muted: rgba(0, 0, 0, 0.5);
        --panel: transparent;
        --hover: rgba(0, 0, 0, 0.05);
        --selected: rgba(0, 0, 0, 0.08);
        --separator: rgba(0, 0, 0, 0.1);
        --field: rgba(255, 255, 255, 0.75);
        --field-border: rgba(0, 0, 0, 0.12);
        --control: rgba(255, 255, 255, 0.8);
        --control-border: rgba(0, 0, 0, 0.1);
        --accent: #007aff;
        --on-accent: #ffffff;
        --success: #28cd41;
        --warning: #ff9500;
        --danger: #ff3b30;
        --avatar: 28px;
        --row-gap: 8px;
        --row-pad: 6px 8px;
        --row-radius: 6px;
        --small: 12px;
        font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }

      :root.mac[data-scheme="dark"] {
        color-scheme: dark;
        --fg: rgba(255, 255, 255, 0.85);
        --muted: rgba(255, 255, 255, 0.55);
        --hover: rgba(255, 255, 255, 0.06);
        --selected: rgba(255, 255, 255, 0.1);
        --separator: rgba(255, 255, 255, 0.12);
        --field: rgba(0, 0, 0, 0.25);
        --field-border: rgba(255, 255, 255, 0.12);
        --control: rgba(255, 255, 255, 0.12);
        --control-border: rgba(255, 255, 255, 0.06);
        --accent: #0a84ff;
        --success: #32d74b;
        --warning: #ff9f0a;
        --danger: #ff453a;
      }

      /* The user's macOS accent color, where WebKit exposes it. */
      @supports (color: AccentColor) {
        :root.mac, :root.mac[data-scheme="dark"] {
          --accent: AccentColor;
          --on-accent: AccentColorText;
        }
      }

      :root.win {
        color-scheme: light;
        --fg: #1a1a1a;
        --muted: #5d5d5d;
        --panel: #f3f3f3;
        --footer: #ebebeb;
        --hover: rgba(0, 0, 0, 0.04);
        --selected: rgba(0, 0, 0, 0.06);
        --separator: rgba(0, 0, 0, 0.08);
        --field: rgba(255, 255, 255, 0.7);
        --field-focus: #ffffff;
        --field-border: rgba(0, 0, 0, 0.06);
        --field-underline: rgba(0, 0, 0, 0.45);
        --control: rgba(255, 255, 255, 0.7);
        --control-hover: rgba(249, 249, 249, 0.5);
        --control-border: rgba(0, 0, 0, 0.06);
        --control-underline: rgba(0, 0, 0, 0.16);
        --accent: #005fb8;
        --on-accent: #ffffff;
        --success: #0f7b0f;
        --warning: #9d5d00;
        --danger: #c42b1c;
        --avatar: 32px;
        --row-gap: 10px;
        --row-pad: 7px 10px;
        --row-radius: 4px;
        --small: 12px;
        font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }

      :root.win[data-scheme="dark"] {
        color-scheme: dark;
        --fg: #ffffff;
        --muted: rgba(255, 255, 255, 0.79);
        --panel: #202020;
        --footer: #1c1c1c;
        --hover: rgba(255, 255, 255, 0.06);
        --selected: rgba(255, 255, 255, 0.08);
        --separator: rgba(255, 255, 255, 0.08);
        --field: rgba(255, 255, 255, 0.06);
        --field-focus: #1f1f1f;
        --field-border: rgba(255, 255, 255, 0.08);
        --field-underline: rgba(255, 255, 255, 0.54);
        --control: rgba(255, 255, 255, 0.06);
        --control-hover: rgba(255, 255, 255, 0.08);
        --control-border: rgba(255, 255, 255, 0.07);
        --control-underline: rgba(255, 255, 255, 0.05);
        --accent: #60cdff;
        --on-accent: #000000;
        --success: #6ccb5f;
        --warning: #fce100;
        --danger: #ff99a4;
      }

      /* --- Shared --- */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-font-smoothing: antialiased;
        cursor: default;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--panel);
        color: var(--fg);
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      header h1 {
        flex: 1;
        margin: 0;
        font-size: inherit;
        font-weight: 600;
      }

      /* As tall as its rows: the window is sized to fit (see reportHeight),
         up to a maximum, past which the list scrolls. */
      main {
        flex: 0 1 auto;
        min-height: 0;
        overflow-y: auto;
      }

      .conv {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: var(--row-gap);
        padding: var(--row-pad);
        border-radius: var(--row-radius);
      }

      .conv:hover {
        background: var(--hover);
      }

      .conv.selected {
        background: var(--selected);
      }

      .avatar {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: var(--avatar);
        height: var(--avatar);
        border-radius: 50%;
        color: #ffffff;
        font-size: calc(var(--avatar) * 0.4);
        font-weight: 600;
      }

      .avatar svg {
        width: 60%;
        height: 60%;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
      }

      .conv-body {
        flex: 1;
        min-width: 0;
      }

      .conv-head {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        flex-shrink: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        visibility: hidden;
      }

      .conv.unread .dot {
        visibility: visible;
      }

      .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .conv.unread .name {
        font-weight: 600;
      }

      .time {
        flex-shrink: 0;
        color: var(--muted);
        font-size: var(--small);
      }

      .snippet {
        margin-top: 1px;
        overflow: hidden;
        color: var(--muted);
        font-size: var(--small);
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .conv.unread .snippet, .conv.selected .snippet {
        color: var(--fg);
      }

      .conv.selected .snippet {
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .reply {
        margin-top: 8px;
      }

      .reply-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .reply input {
        flex: 1;
        min-width: 0;
        color: var(--fg);
        font: inherit;
        font-size: var(--small);
        outline: none;
        user-select: text;
        -webkit-user-select: text;
      }

      .reply-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--fg);
        font: inherit;
        font-size: var(--small);
        white-space: nowrap;
        cursor: default;
      }

      .btn.emoji {
        font-size: 14px;
      }

      .btn.send {
        background: var(--accent);
        color: var(--on-accent);
      }

      .btn.send svg {
        width: 14px;
        height: 14px;
      }

      .btn:disabled, .reply input:disabled {
        opacity: 0.5;
      }

      .btn:focus-visible, .menu-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .note {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: var(--small);
      }

      .empty {
        padding: 60px 24px;
        color: var(--muted);
        text-align: center;
      }

      .empty strong {
        display: block;
        margin-bottom: 6px;
        color: var(--fg);
        font-weight: 600;
      }

      /* The connection state, or for a few seconds the outcome of an action. */
      .status-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        color: var(--muted);
        font-size: var(--small);
      }

      .conn-dot {
        flex-shrink: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }

      .status-bar[data-conn="connected"] .conn-dot {
        background: var(--success);
      }

      .status-bar[data-conn="elsewhere"] .conn-dot,
      .status-bar[data-conn="offline"] .conn-dot,
      .status-bar[data-conn="phone"] .conn-dot {
        background: var(--warning);
      }

      .status-bar[data-conn=""] .conn-dot {
        display: none;
      }

      #status {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #status.ok {
        color: var(--success);
      }

      #status.err {
        color: var(--danger);
      }

      .menu-item {
        border: none;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: default;
      }

      .menu-item svg {
        width: 16px;
        height: 16px;
      }

      /* --- macOS: menu bar panel --- */
      .mac body {
        padding: 6px;
        border-radius: 12px; /* POPOVER_CORNER_RADIUS in lib.rs */
      }

      .mac[data-scheme="dark"] body {
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.15);
      }

      .mac header {
        padding: 4px 8px 6px;
      }

      .mac .time {
        font-size: 11px;
      }

      /* Names line up unless a dot is showing (Windows keeps its slot on the
         right, so the times line up instead). */
      .mac .conv:not(.unread) .dot {
        display: none;
      }

      .mac .reply input {
        height: 24px;
        padding: 0 10px;
        border: 0.5px solid var(--field-border);
        border-radius: 12px;
        background: var(--field);
      }

      .mac .reply input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent);
      }

      .mac .btn {
        height: 22px;
        padding: 0 9px;
        border: 0.5px solid var(--control-border);
        border-radius: 5px;
        background: var(--control);
        box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.08);
      }

      .mac .btn:active:not(:disabled) {
        filter: brightness(0.94);
      }

      .mac .btn.send {
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: var(--accent);
      }

      .mac .btn.send .label {
        display: none;
      }

      .mac footer {
        margin-top: 5px;
        padding-top: 5px;
        border-top: 0.5px solid var(--separator);
      }

      .mac .footer-actions {
        display: flex;
        flex-direction: column;
      }

      .mac .menu-item {
        display: flex;
        justify-content: space-between;
        padding: 3px 8px;
        border-radius: 5px;
        text-align: left;
      }

      .mac .menu-item:hover {
        background: var(--hover);
      }

      .mac .menu-item svg {
        display: none;
      }

      .mac .shortcut {
        color: var(--muted);
      }

      /* --- Windows 11: tray flyout --- */
      .win header {
        padding: 12px 12px 6px 16px;
      }

      .win main {
        padding: 0 6px 4px;
      }

      .win .conv.selected::before {
        content: "";
        position: absolute;
        left: 0;
        top: 15px;
        width: 3px;
        height: 16px;
        border-radius: 2px;
        background: var(--accent);
      }

      .win .dot {
        order: 3;
        width: 8px;
        height: 8px;
      }

      .win .reply input {
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--field-border);
        border-bottom-color: var(--field-underline);
        border-radius: 4px;
        background: var(--field);
      }

      .win .reply input:focus {
        border-bottom: 2px solid var(--accent);
        background: var(--field-focus);
      }

      .win .btn {
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--control-border);
        border-bottom-color: var(--control-underline);
        border-radius: 4px;
        background: var(--control);
        font-size: 13px;
      }

      .win .btn:hover:not(:disabled) {
        background: var(--control-hover);
      }

      .win .btn.send {
        height: 32px;
        padding: 0 14px;
        border-color: transparent;
        background: var(--accent);
      }

      .win .btn.send:hover:not(:disabled) {
        background: var(--accent);
        filter: brightness(1.08);
      }

      .win .btn.send svg {
        display: none;
      }

      .win #useHere {
        height: 24px;
      }

      .win footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px 6px 16px;
        border-top: 1px solid var(--separator);
        background: var(--footer);
      }

      .win .status-bar {
        flex: 1;
      }

      .win .footer-actions {
        display: flex;
        flex-shrink: 0;
        gap: 2px;
      }

      .win .menu-item {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 4px;
      }

      .win .menu-item:hover {
        background: var(--hover);
      }

      .win .menu-item .label, .win .menu-item .shortcut {
        display: none;
      }
    </style>
    <script>
      // Layout: functions first, then state, then startup.
      //
      // The list and the connection state come from the main window's page
      // (Rust relays them), and replies are typed and sent there, the same
      // way as notification replies. Rust calls the window.__gmPopover*
      // functions below.

      // --- Functions ---
      function invoke(cmd, args) {
        if (window.__TAURI_INTERNALS__) {
          return window.__TAURI_INTERNALS__.invoke(cmd, args);
        }
        return Promise.reject(new Error('Tauri API not available'));
      }

      // Resolves "system" to the OS scheme and exposes the result to the CSS.
      function applyScheme() {
        const scheme = theme === 'light' || theme === 'dark' ? theme : (darkQuery.matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-scheme', scheme);
      }

      // Shows `text` in the status bar in place of the connection state; with
      // a kind ('ok' or 'err') it goes back to the connection after a while.
      function setStatus(text, kind) {
        if (statusTimer) clearTimeout(statusTimer);
        statusTimer = null;
        statusText = text;
        statusKind = kind || '';
        renderStatus();
        if (text && kind) {
          statusTimer = setTimeout(function () { setStatus('', ''); }, 4000);
        }
      }

      function renderStatus() {
        if (!els.status) return;
        const conn = connection || 'loading';
        els.status.textContent = statusText || CONNECTION_LABELS[conn];
        els.status.className = statusText ? statusKind : '';
        els.statusBar.setAttribute('data-conn', statusText ? '' : conn);
        els.statusBar.title = statusText ? '' : (CONNECTION_HINTS[conn] || '');
        els.useHere.hidden = connection !== 'elsewhere' || movingHere;
      }

      function element(tag, className, text) {
        const el = document.createElement(tag);
        if (className) el.className = className;
        if (text) el.textContent = text;
        return el;
      }

      // Up to two initials from the words that start with a letter; empty
      // for phone numbers and the like.
      function initials(title) {
        const words = String(title).split(/[\s,]+/).filter(function (w) { return /^\p{L}/u.test(w); });
        if (!words.length) return '';
        const first = Array.from(words[0])[0];
        const last = words.length > 1 ? Array.from(words[words.length - 1])[0] : '';
        return (first + last).toUpperCase();
      }

      // The contact's photo from Messages, or initials (a person icon for
      // numbers) on a colour picked from the name, as the photo's fallback.
      function buildAvatar(conv) {
        const avatar = element('span', 'avatar');
        avatar.setAttribute('aria-hidden', 'true');
        let hash = 0;
        for (const ch of String(conv.title)) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
        avatar.style.background = AVATAR_COLORS[hash % AVATAR_COLORS.length];
        const showInitials = function () {
          const letters = initials(conv.title);
          if (letters) avatar.textContent = letters;
          else avatar.innerHTML = PERSON_ICON;
        };
        if (conv.photo && /^(data:image\/|https:)/.test(conv.photo)) {
          const img = element('img');
          img.alt = '';
          // Photos come already round (or square), so drop the fallback's
          // colour from behind them.
          img.addEventListener('load', function () {
            avatar.style.background = 'transparent';
          });
          img.addEventListener('error', function () {
            img.remove();
            showInitials();
          });
          img.src = conv.photo;
          avatar.appendChild(img);
        } else {
          showInitials();
        }
        return avatar;
      }

      function selectedConversation() {
        for (let i = 0; i < conversations.length; i++) {
          if (conversations[i].title === selectedTitle) return conversations[i];
        }
        return null;
      }

      function select(title) {
        saveDraft();
        selectedTitle = title;
        render();
        focusReply();
      }

      function moveSelection(step) {
        if (!conversations.length) return;
        let i = conversations.indexOf(selectedConversation());
        i = Math.max(0, Math.min(conversations.length - 1, i + step));
        select(conversations[i].title);
      }

      function saveDraft() {
        if (selectedTitle && els.input) drafts[selectedTitle] = els.input.value;
      }

      function focusReply() {
        if (els.input && !els.input.disabled) els.input.focus();
      }

      function buildReplyPanel(conv) {
        const panel = element('div', 'reply');
        const elsewhere = connection === 'elsewhere';
        if (!conv.canReply) {
          panel.appendChild(element('p', 'note',
            'More than one conversation is named "' + conv.title + '". Open it in Messages to reply.'));
        } else if (elsewhere) {
          panel.appendChild(element('p', 'note',
            'Messages is in use on another computer. Choose "Use here" to reply from this one.'));
        }
        const row = element('div', 'reply-row');
        const input = element('input');
        input.type = 'text';
        input.placeholder = 'Reply…';
        input.maxLength = 2000;
        input.value = drafts[conv.title] || '';
        input.disabled = !conv.canReply || elsewhere || !!pending;
        input.addEventListener('input', saveDraft);
        const sendBtn = element('button', 'btn send');
        sendBtn.type = 'button';
        sendBtn.title = 'Send';
        sendBtn.setAttribute('aria-label', 'Send');
        sendBtn.innerHTML = SEND_ICON;
        sendBtn.appendChild(element('span', 'label', 'Send'));
        sendBtn.disabled = input.disabled;
        sendBtn.addEventListener('click', function () { sendReply(input.value); });
        row.appendChild(input);
        row.appendChild(sendBtn);
        panel.appendChild(row);

        const actions = element('div', 'reply-actions');
        if (quickAction) {
          const quick = element('button', 'btn emoji', quickAction);
          quick.type = 'button';
          quick.title = 'Send ' + quickAction;
          quick.disabled = input.disabled;
          quick.addEventListener('click', function () { sendReply(quickAction); });
          actions.appendChild(quick);
        }
        if (conv.unread) {
          const read = element('button', 'btn', 'Mark as read');
          read.type = 'button';
          read.disabled = !conv.canReply || elsewhere || !!pending;
          read.addEventListener('click', function () { runAction('read', ''); });
          actions.appendChild(read);
        }
        if (actions.childNodes.length) panel.appendChild(actions);

        els.input = input;
        return panel;
      }

      function render() {
        const hadFocus = !!els.input && document.activeElement === els.input;
        els.list.textContent = '';
        els.input = null;
        renderStatus();
        if (!conversations.length) {
          els.list.appendChild(buildEmptyState());
          reportHeight();
          return;
        }
        if (!selectedConversation()) selectedTitle = conversations[0].title;
        conversations.forEach(function (conv) {
          const selected = conv.title === selectedTitle;
          const card = element('div', 'conv' + (selected ? ' selected' : '') + (conv.unread ? ' unread' : ''));
          card.title = 'Double-click to open in Messages';
          card.appendChild(buildAvatar(conv));
          const body = element('div', 'conv-body');
          const head = element('div', 'conv-head');
          head.appendChild(element('span', 'dot'));
          head.appendChild(element('span', 'name', conv.title));
          if (conv.time) head.appendChild(element('span', 'time', conv.time));
          body.appendChild(head);
          body.appendChild(element('div', 'snippet', conv.snippet));
          if (selected) {
            body.appendChild(buildReplyPanel(conv));
          } else {
            card.addEventListener('click', function () { select(conv.title); });
          }
          card.appendChild(body);
          card.addEventListener('dblclick', function () {
            selectedTitle = conv.title;
            runAction('open', '');
          });
          els.list.appendChild(card);
        });
        if (hadFocus) focusReply();
        reportHeight();
      }

      // What the list says when there is nothing in it: still loading (the
      // page says 'loading' until its conversations show), signed out, or
      // really empty.
      function buildEmptyState() {
        const empty = element('div', 'empty');
        if (!loaded || connection === '' || connection === 'loading') {
          empty.appendChild(element('strong', '', 'Loading conversations…'));
        } else if (connection === 'signed-out') {
          empty.appendChild(element('strong', '', 'Not signed in'));
          empty.appendChild(document.createTextNode('Open Messages to sign in or pair your phone.'));
        } else {
          empty.appendChild(element('strong', '', 'No recent messages'));
          empty.appendChild(document.createTextNode('Your recent conversations show up here.'));
        }
        return empty;
      }

      // Tells Rust how tall the content is, so the window fits it instead of
      // leaving a gap under a short list. Measured with the list at its
      // natural height (main doesn't stretch).
      function reportHeight() {
        const body = getComputedStyle(document.body);
        const footer = document.querySelector('footer');
        const height = Math.ceil(
          parseFloat(body.paddingTop) + parseFloat(body.paddingBottom) +
          document.querySelector('header').offsetHeight +
          els.list.scrollHeight +
          parseFloat(getComputedStyle(footer).marginTop) + footer.offsetHeight);
        if (!height || height === reportedHeight) return;
        reportedHeight = height;
        invoke('set_popover_height', { height: height }).catch(function () {});
      }

      function sendReply(text) {
        const message = String(text || '').trim();
        if (!message) return;
        runAction('reply', message);
      }

      // Asks Rust to have the page carry out an action on the selected
      // conversation; the outcome arrives in __gmPopoverActionDone.
      function runAction(action, text) {
        const conv = selectedConversation();
        if (!conv || pending) return;
        if (action === 'open') {
          invoke('popover_action', { title: conv.title, action: 'open', text: '' }).catch(function () {});
          return;
        }
        pending = { title: conv.title, action: action, text: text };
        setStatus(action === 'reply' ? 'Sending to ' + conv.title + '…' : 'Marking as read…', '');
        render();
        pendingTimer = setTimeout(function () {
          finishAction(false, 'No response from Messages. Open it to check.');
        }, ACTION_TIMEOUT_MS);
        invoke('popover_action', { title: conv.title, action: action, text: text }).catch(function () {
          finishAction(false, 'Could not reach Messages.');
        });
      }

      function finishAction(ok, message) {
        const done = pending;
        if (!done) return;
        pending = null;
        if (pendingTimer) clearTimeout(pendingTimer);
        pendingTimer = null;
        // render() refills the box from the drafts, so dropping the sent text
        // clears it (an emoji sent with the quick action leaves it alone).
        if (ok && done.action === 'reply' && (drafts[done.title] || '').trim() === done.text) {
          delete drafts[done.title];
        }
        setStatus(message, ok ? 'ok' : 'err');
        render();
        focusReply();
      }

      // Moves the session from the other computer to this app. The page
      // clicks its own "Use here" button; the move is done once it reports
      // being connected again.
      function useHere() {
        if (movingHere) return;
        movingHere = true;
        setStatus('Moving Messages here…', '');
        moveTimer = setTimeout(function () { finishMove(false); }, ACTION_TIMEOUT_MS);
        invoke('popover_action', { title: '', action: 'use_here', text: '' }).catch(function () {
          finishMove(false);
        });
      }

      function finishMove(ok) {
        if (!movingHere) return;
        movingHere = false;
        if (moveTimer) clearTimeout(moveTimer);
        moveTimer = null;
        if (ok) setStatus('', '');
        else setStatus('Couldn’t move Messages here. Open it to switch.', 'err');
      }

      function refresh() {
        return invoke('get_popover_state').then(function (state) {
          quickAction = state.quickAction || '';
          theme = state.theme || 'system';
          connection = state.connection || '';
          applyScheme();
          conversations = Array.isArray(state.conversations) ? state.conversations : [];
          loaded = true;
          render();
        }, function (err) {
          console.error('[popover] get_popover_state failed:', err);
        });
      }

      function footerAction(action) {
        invoke('popover_action', { title: '', action: action, text: '' }).catch(function () {});
      }

      function handleKeydown(e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          invoke('hide_popover').catch(function () {});
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          moveSelection(e.key === 'ArrowDown' ? 1 : -1);
        } else if (e.key === 'Enter' && !e.shiftKey && e.target === els.input) {
          e.preventDefault();
          sendReply(els.input.value);
        } else if (LOOK === 'mac' && e.metaKey && MAC_SHORTCUTS[e.key.toLowerCase()]) {
          // The shortcuts shown beside the footer items.
          e.preventDefault();
          footerAction(MAC_SHORTCUTS[e.key.toLowerCase()]);
        }
      }

      // --- Entry points called from Rust ---
      window.__gmPopoverUpdate = function (list) {
        saveDraft();
        conversations = Array.isArray(list) ? list : [];
        loaded = true;
        render();
      };

      window.__gmPopoverConnection = function (state) {
        saveDraft();
        connection = state || '';
        if (connection === 'connected') finishMove(true);
        render();
      };

      window.__gmPopoverShown = function () {
        if (!pending && !movingHere) setStatus('', '');
        refresh().then(focusReply);
      };

      window.__gmPopoverActionDone = function (title, action, ok) {
        if (action === 'use_here') {
          // On success, wait for the page to report it is connected.
          if (!ok) finishMove(false);
          return;
        }
        if (!pending || pending.title !== title || pending.action !== action) return;
        let message;
        if (action === 'reply') {
          message = ok ? 'Sent to ' + title : 'Not sent. Check Messages for your reply.';
        } else {
          message = ok ? 'Marked as read' : 'Could not open the conversation.';
        }
        finishAction(ok, message);
      };

      function init() {
        els.list = document.getElementById('list');
        els.status = document.getElementById('status');
        els.statusBar = document.getElementById('statusBar');
        els.useHere = document.getElementById('useHere');
        // A menu bar panel shows the connection by its title, with the
        // footer as menu items; the Windows flyout keeps it in the footer.
        if (LOOK === 'mac') document.querySelector('header').appendChild(els.statusBar);
        els.useHere.addEventListener('click', useHere);
        [['openApp', 'show'], ['settingsBtn', 'settings'], ['quitBtn', 'quit']].forEach(function (pair) {
          document.getElementById(pair[0]).addEventListener('click', function () { footerAction(pair[1]); });
        });
        document.addEventListener('keydown', handleKeydown);
        document.addEventListener('contextmenu', function (e) {
          if (e.target !== els.input) e.preventDefault();
        });
        darkQuery.addEventListener('change', applyScheme);
        render();
        refresh().then(focusReply);
      }

      // --- State ---
      // Rust sets __GM_POPOVER_OS to the OS ("macos", "windows", "linux");
      // Linux uses the Windows look.
      const LOOK = (window.__GM_POPOVER_OS || (/Mac/.test(navigator.platform) ? 'macos' : '')) === 'macos' ? 'mac' : 'win';
      // Keep in step with the page script's ACTION_TIMEOUT_MS budget: opening,
      // typing and the send attempts together take well under this.
      const ACTION_TIMEOUT_MS = 15000;
      // What the status bar says for each connection state the page reports.
      const CONNECTION_LABELS = {
        connected: 'Connected',
        elsewhere: 'Not connected',
        offline: 'Offline',
        phone: 'Can’t reach your phone',
        'signed-out': 'Not signed in',
        loading: 'Connecting…'
      };
      const CONNECTION_HINTS = {
        elsewhere: 'Messages is in use on another computer.',
        offline: 'This computer has no internet connection.',
        phone: 'Messages is trying to reach your phone.',
        'signed-out': 'Open Messages to sign in or pair your phone.'
      };
      const MAC_SHORTCUTS = { o: 'show', ',': 'settings', q: 'quit' };
      const AVATAR_COLORS = ['#e8710a', '#1a73e8', '#d93025', '#188038', '#9334e6', '#e52592', '#12a4af', '#5f6368'];
      const PERSON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
      const SEND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
      const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
      const els = {};
      let theme = 'system';
      let quickAction = '';
      let conversations = [];
      // False until the first get_popover_state answer arrives.
      let loaded = false;
      // The content height last sent to Rust.
      let reportedHeight = 0;
      let selectedTitle = null;
      // The page's connection state (see CONNECTION_LABELS); '' until known.
      let connection = '';
      // Unsent text per conversation, kept while the popover lives.
      const drafts = {};
      // The action waiting for the page's answer: { title, action, text }.
      let pending = null;
      let pendingTimer = null;
      // Waiting for "Use here" to take effect.
      let movingHere = false;
      let moveTimer = null;
      // An action's outcome shown in place of the connection state.
      let statusText = '';
      let statusKind = '';
      let statusTimer = null;

      // --- Startup ---
      document.documentElement.classList.add(LOOK);
      applyScheme();
      document.addEventListener('DOMContentLoaded', init);
    </script>
  </head>
  <body>
    <header>
      <h1>Messages</h1>
    </header>
    <main id="list"></main>
    <footer>
      <div id="statusBar" class="status-bar" data-conn="">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="status" role="status"></span>
        <button id="useHere" class="btn" type="button" title="Move Messages from your other computer to this one" hidden>Use here</button>
      </div>
      <div class="footer-actions">
        <button id="openApp" class="menu-item" type="button" title="Open Messages" aria-label="Open Messages">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z" />
          </svg>
          <span class="label">Open Messages</span><span class="shortcut">⌘O</span>
        </button>
        <button id="settingsBtn" class="menu-item" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
          </svg>
          <span class="label">Settings…</span><span class="shortcut">⌘,</span>
        </button>
        <button id="quitBtn" class="menu-item" type="button" title="Quit Google Messages" aria-label="Quit Google Messages">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M13 3h-2v10h2V3zm4.83 2.17-1.42 1.42A6.92 6.92 0 0 1 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.18.99-4.12 2.58-5.42L6.17 5.17A8.932 8.932 0 0 0 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z" />
          </svg>
          <span class="label">Quit</span><span class="shortcut">⌘Q</span>
        </button>
      </div>
    </footer>
  </body>
</html>
