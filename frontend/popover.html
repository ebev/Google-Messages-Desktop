<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recent messages</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f2f3f7;
        --card-bg: #ffffff;
        --card-border: rgba(0, 0, 0, 0.08);
        --selected-border: rgba(11, 87, 208, 0.45);
        --fg: #1c1c1e;
        --muted: #6c6c70;
        --accent: #0b57d0;
        --accent-fg: #ffffff;
        --input-bg: #f5f6f8;
        --input-border: rgba(0, 0, 0, 0.14);
        --btn-bg: #ffffff;
        --btn-border: rgba(0, 0, 0, 0.15);
        --btn-hover: #f2f2f7;
        --danger: #d93025;
        --success: #188038;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, Ubuntu, sans-serif;
      }

      /* `data-scheme` is the resolved light/dark scheme, set by applyScheme(). */
      :root[data-scheme="dark"] {
        color-scheme: dark;
        --canvas: #131314;
        --card-bg: #1e1f22;
        --card-border: rgba(255, 255, 255, 0.08);
        --selected-border: rgba(138, 180, 248, 0.5);
        --fg: #e3e3e3;
        --muted: #9aa0a6;
        --accent: #8ab4f8;
        --accent-fg: #082046;
        --input-bg: #141517;
        --input-border: rgba(255, 255, 255, 0.14);
        --btn-bg: #282a2e;
        --btn-border: rgba(255, 255, 255, 0.12);
        --btn-hover: #33363b;
        --danger: #f28b82;
        --success: #81c995;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--canvas);
        color: var(--fg);
        font-size: 13px;
        border: 1px solid var(--card-border);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 6px 14px;
      }

      header h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .icon-btn:hover {
        background: var(--btn-hover);
        color: var(--fg);
      }

      .icon-btn svg {
        width: 18px;
        height: 18px;
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 2px 10px 6px;
      }

      .conv {
        padding: 9px 11px;
        margin-bottom: 6px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        cursor: pointer;
      }

      .conv.selected {
        border-color: var(--selected-border);
        cursor: default;
      }

      .conv-head {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        flex-shrink: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        visibility: hidden;
      }

      .conv.unread .dot {
        visibility: visible;
      }

      .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
      }

      .conv.unread .name {
        font-weight: 700;
      }

      .time {
        flex-shrink: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .snippet {
        margin-top: 3px;
        padding-left: 13px;
        color: var(--muted);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }

      .conv.unread .snippet {
        color: var(--fg);
      }

      .conv.selected .snippet {
        -webkit-line-clamp: 4;
      }

      .reply {
        margin-top: 9px;
        padding-left: 13px;
      }

      .reply-row {
        display: flex;
        gap: 6px;
      }

      .reply input {
        flex: 1;
        min-width: 0;
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--input-border);
        border-radius: 16px;
        background: var(--input-bg);
        color: var(--fg);
        font: inherit;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
      }

      .reply input:focus {
        border-color: var(--accent);
      }

      .btn {
        height: 28px;
        padding: 0 11px;
        border: 1px solid var(--btn-border);
        border-radius: 14px;
        background: var(--btn-bg);
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }

      .btn:hover:not(:disabled) {
        background: var(--btn-hover);
      }

      .btn.primary {
        height: 32px;
        border-color: transparent;
        border-radius: 16px;
        background: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
      }

      .btn.primary:hover:not(:disabled) {
        background: var(--accent);
        filter: brightness(1.08);
      }

      .btn:disabled, .reply input:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .reply-actions {
        display: flex;
        gap: 6px;
        margin-top: 7px;
      }

      .reply-actions .emoji {
        font-size: 15px;
        padding: 0 9px;
      }

      .note {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .empty {
        padding: 70px 24px;
        text-align: center;
        color: var(--muted);
      }

      .empty strong {
        display: block;
        margin-bottom: 6px;
        color: var(--fg);
        font-weight: 600;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px 6px 14px;
        border-top: 1px solid var(--card-border);
      }

      #status {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-size: 12px;
      }

      #status.ok {
        color: var(--success);
      }

      #status.err {
        color: var(--danger);
      }

      .footer-actions {
        display: flex;
        flex-shrink: 0;
        gap: 2px;
      }
    </style>
    <script>
      // Layout: functions first, then state, then startup.
      //
      // The list comes from the main window's page (Rust relays it), and
      // replies are typed and sent there, the same way as notification
      // replies. Rust calls the three window.__gmPopover* functions below.

      // --- Functions ---
      function invoke(cmd, args) {
        if (window.__TAURI_INTERNALS__) {
          return window.__TAURI_INTERNALS__.invoke(cmd, args);
        }
        return Promise.reject(new Error('Tauri API not available'));
      }

      // Resolves "system" to the OS scheme and exposes the result to the CSS.
      function applyScheme() {
        const scheme = theme === 'light' || theme === 'dark' ? theme : (darkQuery.matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-scheme', scheme);
      }

      function setStatus(text, kind) {
        if (statusTimer) clearTimeout(statusTimer);
        statusTimer = null;
        els.status.textContent = text;
        els.status.className = kind || '';
        if (text && kind) {
          statusTimer = setTimeout(function () { setStatus('', ''); }, 4000);
        }
      }

      function element(tag, className, text) {
        const el = document.createElement(tag);
        if (className) el.className = className;
        if (text) el.textContent = text;
        return el;
      }

      function selectedConversation() {
        for (let i = 0; i < conversations.length; i++) {
          if (conversations[i].title === selectedTitle) return conversations[i];
        }
        return null;
      }

      function select(title) {
        saveDraft();
        selectedTitle = title;
        render();
        focusReply();
      }

      function moveSelection(step) {
        if (!conversations.length) return;
        let i = conversations.indexOf(selectedConversation());
        i = Math.max(0, Math.min(conversations.length - 1, i + step));
        select(conversations[i].title);
      }

      function saveDraft() {
        if (selectedTitle && els.input) drafts[selectedTitle] = els.input.value;
      }

      function focusReply() {
        if (els.input && !els.input.disabled) els.input.focus();
      }

      function buildReplyPanel(conv) {
        const panel = element('div', 'reply');
        if (!conv.canReply) {
          panel.appendChild(element('p', 'note',
            'More than one conversation is named "' + conv.title + '". Open it in Messages to reply.'));
        }
        const row = element('div', 'reply-row');
        const input = element('input');
        input.type = 'text';
        input.placeholder = 'Reply…';
        input.maxLength = 2000;
        input.value = drafts[conv.title] || '';
        input.disabled = !conv.canReply || !!pending;
        input.addEventListener('input', saveDraft);
        const sendBtn = element('button', 'btn primary', 'Send');
        sendBtn.type = 'button';
        sendBtn.disabled = input.disabled;
        sendBtn.addEventListener('click', function () { sendReply(input.value); });
        row.appendChild(input);
        row.appendChild(sendBtn);
        panel.appendChild(row);

        const actions = element('div', 'reply-actions');
        if (quickAction) {
          const quick = element('button', 'btn emoji', quickAction);
          quick.type = 'button';
          quick.title = 'Send ' + quickAction;
          quick.disabled = input.disabled;
          quick.addEventListener('click', function () { sendReply(quickAction); });
          actions.appendChild(quick);
        }
        if (conv.unread) {
          const read = element('button', 'btn', 'Mark as read');
          read.type = 'button';
          read.disabled = !conv.canReply || !!pending;
          read.addEventListener('click', function () { runAction('read', ''); });
          actions.appendChild(read);
        }
        const open = element('button', 'btn', 'Open');
        open.type = 'button';
        open.title = 'Open this conversation in Messages';
        open.addEventListener('click', function () { runAction('open', ''); });
        actions.appendChild(open);
        panel.appendChild(actions);

        els.input = input;
        return panel;
      }

      function render() {
        const hadFocus = !!els.input && document.activeElement === els.input;
        els.list.textContent = '';
        els.input = null;
        if (!conversations.length) {
          const empty = element('div', 'empty');
          empty.appendChild(element('strong', '', 'No recent messages'));
          empty.appendChild(document.createTextNode(
            'Your recent conversations show up here once Google Messages has loaded.'));
          els.list.appendChild(empty);
          return;
        }
        if (!selectedConversation()) selectedTitle = conversations[0].title;
        conversations.forEach(function (conv) {
          const selected = conv.title === selectedTitle;
          const card = element('div', 'conv' + (selected ? ' selected' : '') + (conv.unread ? ' unread' : ''));
          const head = element('div', 'conv-head');
          head.appendChild(element('span', 'dot'));
          head.appendChild(element('span', 'name', conv.title));
          if (conv.time) head.appendChild(element('span', 'time', conv.time));
          card.appendChild(head);
          card.appendChild(element('div', 'snippet', conv.snippet));
          if (selected) {
            card.appendChild(buildReplyPanel(conv));
          } else {
            card.addEventListener('click', function () { select(conv.title); });
          }
          card.addEventListener('dblclick', function () {
            selectedTitle = conv.title;
            runAction('open', '');
          });
          els.list.appendChild(card);
        });
        if (hadFocus) focusReply();
      }

      function sendReply(text) {
        const message = String(text || '').trim();
        if (!message) return;
        runAction('reply', message);
      }

      // Asks Rust to have the page carry out an action on the selected
      // conversation; the outcome arrives in __gmPopoverActionDone.
      function runAction(action, text) {
        const conv = selectedConversation();
        if (!conv || pending) return;
        if (action === 'open') {
          invoke('popover_action', { title: conv.title, action: 'open', text: '' }).catch(function () {});
          return;
        }
        pending = { title: conv.title, action: action, text: text };
        setStatus(action === 'reply' ? 'Sending to ' + conv.title + '…' : 'Marking as read…', '');
        render();
        pendingTimer = setTimeout(function () {
          finishAction(false, 'No response from Messages. Open it to check.');
        }, ACTION_TIMEOUT_MS);
        invoke('popover_action', { title: conv.title, action: action, text: text }).catch(function () {
          finishAction(false, 'Could not reach Messages.');
        });
      }

      function finishAction(ok, message) {
        const done = pending;
        if (!done) return;
        pending = null;
        if (pendingTimer) clearTimeout(pendingTimer);
        pendingTimer = null;
        // render() refills the box from the drafts, so dropping the sent text
        // clears it (an emoji sent with the quick action leaves it alone).
        if (ok && done.action === 'reply' && (drafts[done.title] || '').trim() === done.text) {
          delete drafts[done.title];
        }
        setStatus(message, ok ? 'ok' : 'err');
        render();
        focusReply();
      }

      function refresh() {
        return invoke('get_popover_state').then(function (state) {
          quickAction = state.quickAction || '';
          theme = state.theme || 'system';
          applyScheme();
          conversations = Array.isArray(state.conversations) ? state.conversations : [];
          render();
        }, function (err) {
          console.error('[popover] get_popover_state failed:', err);
        });
      }

      function handleKeydown(e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          invoke('hide_popover').catch(function () {});
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          moveSelection(e.key === 'ArrowDown' ? 1 : -1);
        } else if (e.key === 'Enter' && !e.shiftKey && e.target === els.input) {
          e.preventDefault();
          sendReply(els.input.value);
        }
      }

      // --- Entry points called from Rust ---
      window.__gmPopoverUpdate = function (list) {
        saveDraft();
        conversations = Array.isArray(list) ? list : [];
        render();
      };

      window.__gmPopoverShown = function () {
        if (!pending) setStatus('', '');
        refresh().then(focusReply);
      };

      window.__gmPopoverActionDone = function (title, action, ok) {
        if (!pending || pending.title !== title || pending.action !== action) return;
        let message;
        if (action === 'reply') {
          message = ok ? 'Sent to ' + title : 'Not sent. Check Messages for your reply.';
        } else {
          message = ok ? 'Marked as read' : 'Could not open the conversation.';
        }
        finishAction(ok, message);
      };

      function init() {
        els.list = document.getElementById('list');
        els.status = document.getElementById('status');
        [['openApp', 'show'], ['settingsBtn', 'settings'], ['quitBtn', 'quit']].forEach(function (pair) {
          document.getElementById(pair[0]).addEventListener('click', function () {
            invoke('popover_action', { title: '', action: pair[1], text: '' }).catch(function () {});
          });
        });
        document.addEventListener('keydown', handleKeydown);
        document.addEventListener('contextmenu', function (e) {
          if (e.target !== els.input) e.preventDefault();
        });
        darkQuery.addEventListener('change', applyScheme);
        render();
        refresh().then(focusReply);
      }

      // --- State ---
      // Keep in step with the page script's ACTION_TIMEOUT_MS budget: opening,
      // typing and the send attempts together take well under this.
      const ACTION_TIMEOUT_MS = 15000;
      const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
      const els = {};
      let theme = 'system';
      let quickAction = '';
      let conversations = [];
      let selectedTitle = null;
      // Unsent text per conversation, kept while the popover lives.
      const drafts = {};
      // The action waiting for the page's answer: { title, action, text }.
      let pending = null;
      let pendingTimer = null;
      let statusTimer = null;

      // --- Startup ---
      applyScheme();
      document.addEventListener('DOMContentLoaded', init);
    </script>
  </head>
  <body>
    <header>
      <h1>Recent messages</h1>
      <button id="openApp" class="icon-btn" type="button" title="Open Messages" aria-label="Open Messages">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z" />
        </svg>
      </button>
    </header>
    <main id="list"></main>
    <footer>
      <span id="status" role="status"></span>
      <div class="footer-actions">
        <button id="settingsBtn" class="icon-btn" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
          </svg>
        </button>
        <button id="quitBtn" class="icon-btn" type="button" title="Quit Google Messages" aria-label="Quit Google Messages">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M13 3h-2v10h2V3zm4.83 2.17-1.42 1.42A6.92 6.92 0 0 1 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.18.99-4.12 2.58-5.42L6.17 5.17A8.932 8.932 0 0 0 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z" />
          </svg>
        </button>
      </div>
    </footer>
  </body>
</html>
