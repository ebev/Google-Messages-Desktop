[package]
name = "google-messages"
version = "1.2.0"
edition = "2021"

[lib]
name = "google_messages_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: needed to auto-grant WebView2 microphone/camera permission
# requests so calls work without a per-session prompt. Version pinned to match
# what wry 0.55 uses, so the COM types unify.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"

# Linux-only: needed to enable WebKitGTK media-stream/WebRTC settings and
# auto-grant user-media permission requests so calls work. Version pinned to
# match what wry 0.55 uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
