[package]
name = "google-messages"
version = "1.5.0"
edition = "2021"

[lib]
name = "google_messages_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS-only: native NSUserNotificationCenter click/action handling and
# NSProcessInfo App Nap activity control for reliable background operation.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSAttributedString", "NSGeometry", "NSProcessInfo", "NSString", "NSObject", "NSUserNotification"] }

# Windows-only: needed to auto-grant WebView2 microphone/camera/notification
# permission requests so calls and notifications work without prompts. Version
# pinned to match what wry 0.55 uses, so the COM types unify.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Native toast notifications (reply field and buttons) and the registry entry
# that gives them the app's name and icon. Same version Tauri already uses.
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "UI_Notifications", "Win32_System_Registry"] }

# Linux-only: needed to enable WebKitGTK media-stream/WebRTC settings and
# auto-grant user-media permission requests so calls work, plus D-Bus desktop
# notifications with click/action handling.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
notify-rust = "4"
