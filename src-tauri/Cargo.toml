[package]
name = "google-messages"
version = "0.4.0"
edition = "2021"

[lib]
name = "google_messages_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: needed to auto-grant WebView2 microphone/camera permission
# requests so calls work without a per-session prompt. Version pinned to match
# what wry 0.55 uses, so the COM types unify.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
